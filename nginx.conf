user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    gzip  on;

    proxy_connect_timeout       75s;
    proxy_send_timeout          300s;
    proxy_read_timeout          300s;
    send_timeout                300s;
    proxy_buffers               16 64k;
    proxy_buffer_size           128k;
    large_client_header_buffers 4 32k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Résolution DNS dynamique (nécessaire car proxy_pass utilise une variable)
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    # Choix du backend selon la page d'origine de la requête
    map $http_referer $backend_host {
        default                          clouvert.duckdns.org;
        ~^https?://[^/]+/recettes(/|$)   clouvert-recettes.duckdns.org;
    }

    server {
        listen 10000;
        server_name testproject-dkhr.onrender.com;

        # ---------- Recettes : /recettes/ ----------
        location = /recettes {
            return 301 /recettes/;
        }

        location /recettes/ {
            # Le "/" final retire le préfixe /recettes avant transmission
            proxy_pass https://clouvert-recettes.duckdns.org/;
            proxy_set_header Host clouvert-recettes.duckdns.org;

            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /recettes;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_verify off;

            proxy_request_buffering off;
            proxy_buffering off;

            # Réécriture des redirections de l'origine
            proxy_redirect https://clouvert-recettes.duckdns.org/ /recettes/;
            proxy_redirect / /recettes/;
        }

        # ---------- Test ----------
        location /test {
            proxy_pass https://httpbin.org;
            proxy_set_header Host httpbin.org;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ---------- Home Assistant (défaut) + appels absolus issus de /recettes/ ----------
        location / {
            proxy_pass https://$backend_host;
            proxy_set_header Host $backend_host;
            proxy_ssl_name $backend_host;

            proxy_set_header X-Forwarded-Proto https;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_verify off;

            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}
